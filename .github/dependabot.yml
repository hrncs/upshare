# Dependabot configuration for upshare-cli
# Docs: https://docs.github.com/en/code-security/how-tos/secure-your-supply-chain/secure-your-dependencies/configure-version-updates
# Config syntax version is always `2` (latest, required).
# `npm` ecosystem covers pnpm (pnpm v7/v8/v9/v10 supported via `npm`).
version: 2
updates:
  # npm / pnpm dependencies (package.json + pnpm-lock.yaml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    # Wait 3 days after a release before opening a PR (filters bad releases).
    # Hold majors a bit longer since they can break the CLI.
    cooldown:
      default-days: 3
      semver-major-days: 7
    groups:
      # Group non-breaking updates into one PR to reduce noise.
      minor-patch:
        update-types:
          - "minor"
          - "patch"
      # Majors stay ungrouped (one PR per major) for careful review.

  # GitHub Actions (ci.yml, release.yml use checkout/setup-node/pnpm setup)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Etc/UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      actions:
        patterns:
          - "*"
